<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel | Evaluación DNB</title>
<style>:root{--b:#16110e;--c:#211a15;--r:#c8272d;--g:#d4a94e;--t:#f3eadb;--m:#a99b8c;--l:rgba(212,169,78,.25)}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:15px Arial}.shell{max-width:1300px;margin:auto;padding:25px}.hero,.card{background:var(--c);border:1px solid var(--l);border-top:5px solid var(--r);padding:20px;margin-bottom:18px}.hero h1{margin:5px 0}.muted{color:var(--m)}button,select{padding:11px;background:#100d0b;color:var(--t);border:1px solid var(--l)}button{cursor:pointer;background:var(--r)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{padding:18px;background:#100d0b;border-top:3px solid var(--g)}.metric small{display:block;color:var(--m)}.metric strong{font-size:2rem;color:var(--g)}table{width:100%;border-collapse:collapse;min-width:1100px}th,td{padding:9px;border-bottom:1px solid var(--l);text-align:left;font-size:.8rem}th{color:var(--g)}.wrap{overflow:auto}@media(max-width:700px){.metrics{grid-template-columns:1fr 1fr}}</style></head>
<body><main class="shell"><header class="hero"><h1>Evaluación de cursos y docentes</h1><p class="muted">Resultados anónimos · Acceso directo sin contraseña</p><button onclick="load()">Actualizar</button></header>
<section class="metrics"><div class="metric"><small>Evaluaciones</small><strong id="total">0</strong></div><div class="metric"><small>Docente / 50</small><strong id="avgTeacher">0</strong></div><div class="metric"><small>Curso / 15</small><strong id="avgCourse">0</strong></div><div class="metric"><small>Resultado final</small><strong id="avgFinal">0%</strong></div></section>
<section class="card"><label>Filtrar materia </label><select id="filter"><option value="">Todas</option></select><button onclick="render()">Aplicar</button></section>
<section class="card"><div class="wrap"><table><thead><tr><th>Fecha</th><th>Materia</th><th>Docente</th><th>Nivel</th><th>Duración</th><th>Útil</th><th>Docente</th><th>Curso</th><th>Total</th><th>%</th><th>Clasificación</th><th>Continuidad</th><th>Acción</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<script>
const API_URL='PEGAR_AQUI_URL_EXEC';let data=[];const $=x=>document.getElementById(x);
function classification(p){p=Number(p);return p>=90?'Excelente':p>=80?'Muy bueno':p>=70?'Bueno':p>=60?'Regular':'Insuficiente'}
async function get(a){const u=new URL(API_URL);u.searchParams.set('accion',a);const r=await fetch(u);const j=await r.json();if(!j.ok)throw Error(j.error);return j}
async function load(){try{const j=await get('admin_bootstrap');data=j.evaluaciones||[];$('filter').innerHTML='<option value="">Todas</option>'+(j.cursos||[]).map(x=>`<option>${x}</option>`).join('');render()}catch(e){alert('No se pudieron cargar los datos: '+e.message)}}
function avg(k,list){return list.length?(list.reduce((s,x)=>s+Number(x[k]||0),0)/list.length).toFixed(1):'0'}
function render(){const l=data.filter(x=>!$('filter').value||x.curso===$('filter').value);$('total').textContent=l.length;$('avgTeacher').textContent=avg('puntajeDocente',l);$('avgCourse').textContent=avg('puntajeCurso',l);$('avgFinal').textContent=avg('porcentajeFinal',l)+'%';$('rows').innerHTML=l.slice().reverse().map(x=>`<tr><td>${x.fecha}</td><td>${x.curso}</td><td>${x.docente}</td><td>${x.nivel}</td><td>${x.duracion}</td><td>${x.utilidad}</td><td>${x.puntajeDocente}/50</td><td>${x.puntajeCurso}/15</td><td>${x.puntajeFinal}/65</td><td>${x.porcentajeFinal}%</td><td>${classification(x.porcentajeFinal)}</td><td>${x.continuidad}</td><td><button onclick="del(${x.fila})">Eliminar</button></td></tr>`).join('')||'<tr><td colspan="13">Sin evaluaciones</td></tr>'}
async function del(f){if(!confirm('¿Eliminar esta evaluación?'))return;const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({accion:'eliminar_evaluacion',fila:f})});const j=await r.json();if(!j.ok)return alert(j.error);load()}
load();
</script></body></html>
